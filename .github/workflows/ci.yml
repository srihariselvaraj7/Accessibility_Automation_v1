
name: Accessibility Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check Python syntax
        run: python -m py_compile main.py

      - name: Run tests
        run: python -m pytest -v

      - name: Check Git whitespace errors
        run: git diff --check
      
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t "${{ steps.image.outputs.name }}:latest" .
      
      - name: Smoke test Docker image
        run: |
          docker run --rm \
            --entrypoint python \
            "${{ steps.image.outputs.name }}:latest" \
            -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); browser = p.chromium.launch(headless=True); page = browser.new_page(); page.set_content('<title>Smoke Test</title>'); assert page.title() == 'Smoke Test'; print('Docker smoke test passed: Chromium launched and rendered local HTML'); browser.close(); p.stop()"


      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "${{ steps.image.outputs.name }}:latest"
